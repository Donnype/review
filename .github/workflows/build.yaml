name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet and format
        run: go vet ./... && test -z "$(gofmt -l .)"

      - name: Parser test
        run: node parse_test.mjs

      - name: Build
        run: go build -trimpath -ldflags='-s -w' -o "dist/review$(go env GOEXE)" .

      - name: Smoke-test the built binary
        env:
          BROWSER: echo # print the page path instead of opening a browser
        run: |
          set -euo pipefail
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          bin="dist/review$(go env GOEXE)"
          cat > "$RUNNER_TEMP/smoke.patch" <<'PATCH'
          diff --git a/main.go b/main.go
          --- a/main.go
          +++ b/main.go
          @@ -1,3 +1,3 @@
           package main
          -func a() {}
          +func b() {}
           // end
          PATCH

          # Capture output rather than piping into head/grep -q, which close the pipe early and SIGPIPE the binary.
          out=$("$bin" "$RUNNER_TEMP/smoke.patch")
          id=${out%%$'\n'*}
          [[ $id == smoke-* ]]
          grep -q 'func b() {}' "$XDG_CACHE_HOME/review/$id.html"
          test -f "$XDG_CACHE_HOME/review/highlight.min.js"
          "$bin" < "$RUNNER_TEMP/smoke.patch" > /dev/null

          [[ $("$bin" list) == *"$id"* ]]
          [[ $("$bin" open smo) == *"$id.html" ]]
          "$bin" open does-not-exist && exit 1

          trashed=$("$bin" rm "$id")
          [[ $("$bin" list) == *"$id"* ]] && exit 1
          "$bin" restore "$trashed"
          [[ $("$bin" list) == *"$id"* ]]

          [[ $("$bin" completion) == *compdef* ]]

      - uses: actions/upload-artifact@v7
        with:
          name: review-${{ runner.os }}-${{ runner.arch }}
          path: dist/review*
          if-no-files-found: error
